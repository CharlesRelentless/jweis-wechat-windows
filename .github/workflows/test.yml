name: Offline tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.lock
      - run: python -m unittest discover -s probe_tests
      - run: python scripts/generate-schema.py --check
      - run: python scripts/outbound-resource-check.py
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.lock
      - name: Verify official Windows client bundle
        shell: pwsh
        run: |
          $release = Get-Content -LiteralPath releases/windows-client-v0.0.19.json -Raw -Encoding UTF8 | ConvertFrom-Json
          New-Item -ItemType Directory -Path bin | Out-Null
          Invoke-WebRequest -Uri $release.url -OutFile bin/client.zip
          if ((Get-FileHash -LiteralPath bin/client.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $release.sha256) {
            throw 'Archive digest mismatch'
          }
          Expand-Archive -LiteralPath bin/client.zip -DestinationPath bin/extracted
          foreach ($name in @('tunnel-client.exe', 'cloudflared.exe')) {
            $files = @(Get-ChildItem -LiteralPath bin/extracted -Recurse -File | Where-Object Name -eq $name)
            if ($files.Count -ne 1) { throw "Unexpected file count: $name" }
            if ((Get-FileHash -LiteralPath $files[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne $release.files.$name) {
              throw "File digest mismatch: $name"
            }
            Copy-Item -LiteralPath $files[0].FullName -Destination (Join-Path bin $name)
          }
          Copy-Item -LiteralPath releases/windows-client-v0.0.19.json -Destination bin/release-verification.json
          python -c 'from pathlib import Path; from probe.client_integrity import verify_bundle; verify_bundle(Path.cwd())'
          if ($LASTEXITCODE -ne 0) { throw 'Bundle verification failed' }
      - name: Use a canonical temporary directory for private-path checks
        shell: pwsh
        run: |
          python -c 'from pathlib import Path; import tempfile; p=Path(tempfile.gettempdir()); print("runner_temp="+str(p)); print("resolved_runner_temp="+str(p.resolve()))'
          $taskTemp = 'C:\jweis-ci-temp'
          New-Item -ItemType Directory -Path $taskTemp -Force | Out-Null
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "TEMP=$taskTemp" -Encoding utf8
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "TMP=$taskTemp" -Encoding utf8
      - name: Verify owner ACL representation
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import tempfile
          from probe.platform_io import win_files, private_dir, is_private
          win = win_files()
          print('owner_rid=' + win.sid.rsplit('-', 1)[-1])
          print('trusted_sddl_principals=' + ','.join(sorted('literal-SID' if x.startswith('S-') else x for x in win.allowed_sddl_sids)))
          with tempfile.TemporaryDirectory() as folder:
              path = private_dir(Path(folder) / 'acl-probe')
              assert is_private(path), 'Current owner plus SYSTEM must be private'
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Native owner ACL check failed' }
      - run: python -m unittest discover -s probe_tests
      - run: python scripts/generate-schema.py --check
      - run: python scripts/outbound-resource-check.py
